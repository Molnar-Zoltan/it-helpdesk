[changelog]
header = """
# Changelog

All notable changes to this project are documented here, generated from
conventional commit history via [git-cliff](https://git-cliff.org).
"""
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits %}
        - {% if commit.scope %}**{{ commit.scope }}:** {% endif %}{{ commit.message | upper_first }}\
    {% endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

# NOTE: version bumping is deliberately NOT delegated to git-cliff's own
# [bump] engine / `--bumped-version`. As of git-cliff 2.13.0 the documented
# `no_increment_regex` option (meant to stop chore/ci/docs-only commits from
# triggering a bump) is accepted in the config but verified to have no actual
# effect — a chore-only commit still bumps a patch version. Rather than ship
# something that silently doesn't do what the config claims, the release
# workflow computes the next version itself from feat/fix/breaking commits
# via plain grep, and only uses this tool to render the changelog body.
# Revisit if a future git-cliff release actually ships the fix.

[git]
conventional_commits = true
filter_unconventional = true
split_commits = false
protect_breaking_commits = false
filter_commits = false
tag_pattern = "v[0-9]*"
topo_order = false
sort_commits = "oldest"

commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^perf", group = "Performance" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^style", group = "Styling" },
    { message = "^test", group = "Testing" },
    { message = "^build", group = "Build" },
    { message = "^ci", group = "CI/CD" },
    { message = "^revert", group = "Revert" },
    { message = "^chore\\(release\\)", skip = true },
    { message = "^chore", group = "Miscellaneous Tasks" },
    { message = "^Merge pull request", skip = true },
    { message = "^Merge branch", skip = true },
]
